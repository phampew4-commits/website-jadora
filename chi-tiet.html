<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chi tiết sản phẩm · Jadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/hieu-ung.css">
<link rel="stylesheet" href="css/dau.css">
</head>
<body>
<div id="dau"></div>

<main class="bb">
  <div id="ct"></div>
</main>

<div id="chan"></div>

<script src="js/chung.js"></script>
<script src="js/hieu-ung.js"></script>
<script src="js/dau.js"></script>
<script>
var sl=1;
khoiDong(function(){
  var ma=new URLSearchParams(location.search).get('ma');
  var x=timSp(ma);
  if(!x){
    $('#ct').innerHTML='<div class="trong-rong"><h1>Không tìm thấy sản phẩm</h1><p>Món này có thể đã bán hoặc đường dẫn chưa đúng.</p><a class="nut toi" href="san-pham.html">Về cửa hàng</a></div>';
    return;
  }
  document.title=x.ten+' · '+CH.thuongHieu.ten;
  var L=CH.lienHe||{}, V=CH.vanChuyen||{};
  var loiNhan='Mình muốn hỏi về món: '+x.ten+' (mã '+x.ma+') - '+gia(x.gia);
  $('#ct').innerHTML='<div class="ct">'+
    '<div class="ct-anh">'+
      '<div class="ct-lon"><img id="anh-lon" src="'+anh(x.anh[0],1200)+'" alt="'+e(x.ten)+'" referrerpolicy="no-referrer"></div>'+
      (x.anh.length>1?'<div class="ct-nho">'+x.anh.map(function(a,i){return '<button type="button" data-i="'+i+'"'+(i?'':' class="chon"')+'><img src="'+anh(a,240)+'" alt="" loading="lazy" referrerpolicy="no-referrer"></button>'}).join('')+'</div>':'')+
    '</div>'+
    '<div class="ct-tt">'+
      '<p class="nhan"><a href="san-pham.html?loai='+x.loai+'">'+e((LOAI[x.loai]||{}).ten||'Sản phẩm')+'</a></p>'+
      '<h1>'+e(x.ten)+'</h1>'+
      '<div class="ct-gia">'+gia(x.gia)+'</div>'+
      '<p class="ct-nhan">Số lượng</p>'+
      '<div class="so-luong"><button type="button" id="tru" aria-label="Bớt">−</button><span id="sl">1</span><button type="button" id="cong" aria-label="Thêm">+</button></div>'+
      '<button class="nut dac rong" id="them" type="button">Thêm vào giỏ</button>'+
      '<a class="nut phu rong" id="mua" href="gio-hang.html">Mua ngay</a>'+
      '<div class="ct-mo"><h4>Mô tả</h4>'+
        ((x.tp||[]).length?'<p>Đi kèm: '+x.tp.map(e).join(', ')+'.</p>':(x.mo_ta?'<p>'+e(x.mo_ta)+'</p>':''))+
        '<p>'+e((LOAI[x.loai]||{}).ten||'')+' · Mã '+e(x.ma)+' · '+e(x.tt||'Còn hàng')+'</p>'+
        '<p>'+e(V.ghiChu||'')+'. Được kiểm tra hàng trước khi thanh toán.</p></div>'+
      '<p class="ct-hoi">Cần xem thêm ảnh hay hỏi về món này? <a target="_blank" rel="noopener" href="https://zalo.me/'+e(L.zalo||L.sdt)+'">Zalo</a>'+
        (L.messenger?' · <a target="_blank" rel="noopener" href="https://m.me/'+e(L.messenger)+'?text='+encodeURIComponent(loiNhan)+'">Messenger</a>':'')+'</p>'+
    '</div></div>';

  $$('.ct-nho button').forEach(function(b){b.onclick=function(){
    $('#anh-lon').src=anh(x.anh[+b.dataset.i],1200);
    $$('.ct-nho button').forEach(function(o){o.classList.toggle('chon',o===b)});
  }});
  $('#tru').onclick=function(){sl=Math.max(1,sl-1);$('#sl').textContent=sl};
  $('#cong').onclick=function(){sl=Math.min(99,sl+1);$('#sl').textContent=sl};
  $('#them').onclick=function(){themGio(x.ma,sl)};
  $('#mua').onclick=function(){if(!GIO[x.ma]) {GIO[x.ma]=sl; luuGio()}};

});
</script>
</body>
</html>
