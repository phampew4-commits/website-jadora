<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chi tiết sản phẩm · Jadora</title>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link rel="stylesheet" href="css/style.css?v=261123163716">
<link rel="stylesheet" href="css/hieu-ung.css?v=261123163716">
<link rel="stylesheet" href="css/dau.css?v=261123163716">
<link rel="stylesheet" href="css/chi-tiet.css?v=261123163716">
</head>
<body>
<div id="dau"></div>

<main>
  <div class="bb"><nav class="duong-dan" id="duong-dan" aria-label="Đường dẫn"></nav></div>
  <div class="bb" id="ct"></div>
  <section class="ct-buoc" id="buoc-lam"></section>
  <section class="bb ct-cn" id="cam-nhan"></section>
  <section class="bb ct-goi" id="goi-y"></section>
</main>

<div class="ct-dinh" id="dinh"></div>
<div class="ct-phong" id="phong-to" aria-hidden="true"><button type="button" class="dong" aria-label="Đóng">✕</button><img alt=""></div>

<div id="chan"></div>

<script src="js/chung.js?v=261123163716"></script>
<script src="js/hieu-ung.js?v=261123163716"></script>
<script src="js/dau.js?v=261123163716"></script>
<script src="js/khach.js?v=261123163716"></script>
<script>
var sl=1, iAnh=0;
khoiDong(function(){
  var ma=new URLSearchParams(location.search).get('ma');
  var x=timSp(ma);
  if(!x){
    $('#ct').innerHTML='<div class="trang-dau"><h1>Không tìm thấy món này</h1></div><div class="trong-rong"><b>Món này có thể đã bán hoặc đường dẫn chưa đúng.</b><p></p><a class="nut dac" href="san-pham.html">Về cửa hàng</a></div>';
    return;
  }
  var L=CH.lienHe||{}, V=CH.vanChuyen||{}, loai=LOAI[x.loai]||{ten:'Sản phẩm',ngan:'Sản phẩm'};
  document.title=x.ten+' · '+((CH.thuongHieu||{}).ten||'Jadora');
  $('#duong-dan').innerHTML='<a href="index.html">Trang chủ</a><i>/</i><a href="san-pham.html?loai='+x.loai+'">'+e(loai.ten)+'</a><i>/</i><span>'+e(x.ten)+'</span>';

  /* món mới về trong 14 ngày gần nhất của kho */
  var moiNhat=Math.max.apply(null,DS.map(function(y){return ngaySo(y.ngay)}));
  var laMoi=ngaySo(x.ngay)&&moiNhat-ngaySo(x.ngay)<14*864e5;

  /* thành phần đi kèm: món nào đang bán riêng thì dẫn link */
  var theoTen={}; DS.forEach(function(y){if(y.loai==='charm') theoTen[boDau(y.ten)]=y});
  var tp=(x.tp||[]).map(function(t){var ten=t.replace(/\s*\(×\d+\)\s*$/,''); return {chu:t,sp:theoTen[boDau(ten)]}});
  var coCharm=tp.filter(function(t){return t.sp});
  var motDong=x.loai==='chuoi'&&tp.length? 'Chuỗi phối sẵn '+tp.length+' chi tiết, xâu bằng tay.' : (x.mo_ta||'Ảnh chụp thật của đúng món này.');
  var loiNhan='Mình muốn hỏi về món: '+x.ten+' (mã '+x.ma+') - '+gia(x.gia);
  var th=docThich();

  function muc(td,tom,noi,mo){return '<details'+(mo?' open':'')+'><summary><span>'+td+'</span>'+(tom?'<small>'+tom+'</small>':'')+'</summary><div class="noi">'+noi+'</div></details>'}
  var chiTiet=(x.ct||[]).length? '<ul>'+x.ct.map(function(c){return '<li>'+e(c)+'</li>'}).join('')+'</ul>'
    : '<ul><li>Loại: '+e(loai.ten)+'</li><li>Mã món: '+e(x.ma)+'</li>'+(x.ngay?'<li>Lên kệ: '+e(x.ngay.split(' ')[0])+'</li>':'')+'</ul>';

  $('#ct').innerHTML='<div class="ct2">'+
    '<div class="ct2-anh">'+
      '<div class="ct2-lon"><button type="button" class="ct2-khung" id="khung" aria-label="Phóng to ảnh"><img id="anh-lon" src="'+anh(x.anh[0],1600)+'" alt="'+e(x.ten)+'" fetchpriority="high" referrerpolicy="no-referrer"></button>'+
        (x.anh.length>1?'<button class="mt mt-truoc" type="button" data-d="-1" aria-label="Ảnh trước">←</button><button class="mt mt-sau" type="button" data-d="1" aria-label="Ảnh sau">→</button><span class="ct2-dem" id="dem-anh"></span>':'')+'</div>'+
      (x.anh.length>1?'<div class="ct2-nho">'+x.anh.map(function(a,i){return '<button type="button" data-i="'+i+'"'+(i?'':' class="chon"')+' aria-label="Ảnh '+(i+1)+'"><img src="'+anh(a,400)+'" alt="" loading="lazy" referrerpolicy="no-referrer"></button>'}).join('')+'</div>':'')+
      '<figure class="ct2-loi"><blockquote>“Ảnh bạn đang xem là ảnh chụp của đúng món này, không phải ảnh mẫu.”</blockquote><figcaption>'+e((CH.thuongHieu||{}).ten||'')+'</figcaption></figure>'+
    '</div>'+
    '<div class="ct2-tt"><div class="ct2-dinh">'+
      '<p class="ct2-nhan">'+(laMoi?'<span class="the-moi">Mới về</span>':'')+'<a href="san-pham.html?loai='+x.loai+'">'+e(loai.ten)+'</a></p>'+
      '<h1>'+e(x.ten)+'</h1>'+
      '<button class="ct2-luu'+(th[x.ma]?' bat':'')+'" type="button" data-thich="'+e(x.ma)+'">'+BT.thich+'<span>Lưu lại</span></button>'+
      '<p class="ct2-mot">'+e(motDong)+'</p>'+
      '<div class="ct2-gia">'+gia(x.gia)+'</div>'+
      '<p class="ct2-tt-hang"><i></i>'+e(x.tt||'Còn hàng')+' · Mã '+e(x.ma)+'</p>'+
      (tp.length?'<div class="ct2-tp"><p class="ct2-nho-td">Trên món này có</p><div class="ct2-vien">'+tp.map(function(t){
          return t.sp?'<a href="'+linkSp(t.sp)+'" title="Xem charm này"><img src="'+anh(t.sp.anh[0],200)+'" alt="" loading="lazy" referrerpolicy="no-referrer">'+e(t.chu)+'</a>':'<span>'+e(t.chu)+'</span>'}).join('')+'</div>'+
          (coCharm.length?'<p class="ct2-ghi">Món có hình nhỏ là charm đang bán riêng, bấm để xem.</p>':'')+'</div>':'')+
      '<div class="ct2-mua"><div class="so-luong"><button type="button" id="tru" aria-label="Bớt">−</button><span id="sl">1</span><button type="button" id="cong" aria-label="Thêm">+</button></div>'+
        '<button class="nut dac" id="them" type="button">Thêm vào giỏ</button></div>'+
      '<a class="nut phu rong" id="mua" href="dat-hang.html">Mua ngay</a>'+
      '<ul class="ct2-cam">'+(CH.camKet||[]).map(function(c){return '<li>'+e(c.chu)+'</li>'}).join('')+'</ul>'+
      '<p class="ct2-hoi">Cần xem thêm ảnh hay video món này? <a target="_blank" rel="noopener" href="https://zalo.me/'+e(L.zalo||L.sdt)+'">Nhắn Zalo</a>'+
        (L.messenger?' · <a target="_blank" rel="noopener" href="https://m.me/'+e(L.messenger)+'?text='+encodeURIComponent(loiNhan)+'">Messenger</a>':'')+'</p>'+
      '<div class="ct2-xep">'+
        muc('Chi tiết',(x.ct||[]).length?x.ct.length+' mục':'Mã '+e(x.ma),chiTiet,true)+
        (tp.length?muc('Đi kèm',tp.length+' chi tiết','<ul>'+tp.map(function(t){return '<li>'+e(t.chu)+'</li>'}).join('')+'</ul>'):'')+
        muc('Giao hàng &amp; kiểm hàng','2–5 ngày','<ul><li>'+e(V.ghiChu||'')+'.</li><li>Miền Bắc 2–3 ngày, miền Trung và miền Nam 3–5 ngày.</li><li>Món hàng được quay video trước khi gửi.</li><li>Được mở hộp kiểm tra trước khi thanh toán.</li></ul>')+
        muc('Đổi trả','Trong 1 ngày','<ul><li>Đổi trong 1 ngày kể từ khi nhận nếu món không đúng mô tả, khác ảnh hoặc lỗi do vận chuyển.</li><li>Cửa hàng chịu phí ship hai chiều trong trường hợp trên.</li></ul>')+
        (/vàng|18k|14k|10k/i.test(x.ten+' '+(x.tp||[]).join(' '))?muc('Lưu ý về charm vàng','','<ul><li>Charm vàng là charm trang sức, không phải vàng tích sản.</li></ul>'):'')+
      '</div>'+
    '</div></div></div>';

  /* bộ ảnh */
  function doiAnh(i){iAnh=(i+x.anh.length)%x.anh.length;
    var im=$('#anh-lon'); im.classList.add('doi'); im.src=anh(x.anh[iAnh],1600);
    im.onload=function(){im.classList.remove('doi')};
    $$('.ct2-nho button').forEach(function(o,k){o.classList.toggle('chon',k===iAnh)});
    var d=$('#dem-anh'); if(d) d.textContent=(iAnh+1)+' / '+x.anh.length}
  $$('.ct2-nho button').forEach(function(b){b.onclick=function(){doiAnh(+b.dataset.i)}});
  $$('.ct2-lon .mt').forEach(function(b){b.onclick=function(){doiAnh(iAnh+ +b.dataset.d)}});
  doiAnh(0);
  /* món có video: nút phát ngay trên ảnh lớn (chờ danh sách video tải xong) */
  setTimeout(function coVideo(lan){
    if(!VIDEO[x.ma]){ if((lan||0)<10) setTimeout(function(){coVideo((lan||0)+1)},300); return }
    var lon=$('.ct2-lon'); lon.insertAdjacentHTML('beforeend','<button class="ct2-phat" type="button">▶ Xem video</button>');
    $('.ct2-phat').onclick=function(){
      var v=lon.querySelector('video');
      if(v){v.remove(); this.textContent='▶ Xem video'; return}
      lon.querySelector('.ct2-khung').insertAdjacentHTML('beforeend','<video src="'+VIDEO[x.ma].replace('video/sp/','video/goc/')+'" autoplay muted loop playsinline controls></video>');
      this.textContent='✕ Tắt video'};
  },200);
  var phong=$('#phong-to');
  $('#khung').onclick=function(){if(this.querySelector('video')) return; phong.querySelector('img').src=anh(x.anh[iAnh],1600); phong.classList.add('mo'); document.documentElement.classList.add('khoa-cuon')};
  phong.onclick=function(){phong.classList.remove('mo'); document.documentElement.classList.remove('khoa-cuon')};
  document.addEventListener('keydown',function(ev){
    if(ev.key==='Escape') phong.onclick();
    else if(ev.key==='ArrowRight'&&x.anh.length>1) doiAnh(iAnh+1);
    else if(ev.key==='ArrowLeft'&&x.anh.length>1) doiAnh(iAnh-1)});

  /* mua */
  $('#tru').onclick=function(){sl=Math.max(1,sl-1);$('#sl').textContent=sl};
  $('#cong').onclick=function(){sl=Math.min(99,sl+1);$('#sl').textContent=sl};
  $('#them').onclick=function(){themGio(x.ma,sl); moGio()};
  $('#mua').onclick=function(){if(!GIO[x.ma]){GIO[x.ma]=sl; luuGio()}};

  /* thanh mua dính đáy khi nút chính trôi khỏi màn hình */
  var dinh=$('#dinh');
  dinh.innerHTML='<div class="bb"><img src="'+anh(x.anh[0],200)+'" alt="" referrerpolicy="no-referrer"><span><b>'+e(x.ten)+'</b>'+gia(x.gia)+'</span><button class="nut dac" type="button">Thêm vào giỏ</button></div>';
  dinh.querySelector('button').onclick=function(){themGio(x.ma,1); moGio()};
  new IntersectionObserver(function(es){dinh.classList.toggle('hien',!es[0].isIntersecting&&es[0].boundingClientRect.top<0)},{threshold:0}).observe($('#them'));

  /* cách chúng tôi làm */
  var qt=(CH.quyTrinh||[]).slice(0,3);
  if(qt.length) $('#buoc-lam').innerHTML='<div class="bb"><div class="ct-buoc-dau len"><p class="nhan">Từ viên đá đến cổ tay</p><h2>Món này <em>được làm ra</em> thế nào</h2></div>'+
    '<div class="ct-buoc-ds">'+qt.map(function(q){return '<div class="len"><b>'+e(q.so)+'</b><h3>'+nd(q.ten)+'</h3><p>'+e(q.chu)+'</p></div>'}).join('')+'</div></div>';

  /* cảm nhận của khách: chỉ hiện lời thật do cửa hàng duyệt (cau-hinh › camNhan); khách viết thì lưu trên máy và gửi cho cửa hàng */
  var KHOA_CN='jadora_cam_nhan', cnMay={}; try{cnMay=JSON.parse(localStorage.getItem(KHOA_CN))||{}}catch(x){}
  function sao(n){var o='';for(var i=1;i<=5;i++) o+='<i class="'+(i<=n?'day':'')+'">★</i>'; return '<span class="cn-sao" aria-label="'+n+' trên 5 sao">'+o+'</span>'}
  function veCamNhan(){
    var duyet=(CH.camNhan||[]).filter(function(c){return c&&c.chu&&(!c.ma||c.ma===x.ma)});
    var cuaToi=cnMay[x.ma];
    var tb=duyet.length? duyet.reduce(function(t,c){return t+(+c.sao||5)},0)/duyet.length : 0;
    var hs={}; try{hs=JSON.parse(localStorage.getItem('jadora_ho_so'))||{}}catch(e2){}
    var tenSan=(window.KHACH&&KHACH.user&&KHACH.user.displayName)||hs.ten||'';
    $('#cam-nhan').innerHTML='<div class="cn-luoi">'+
      '<div class="cn-trai"><p class="nhan">Cảm nhận</p><h2>Khách nói gì <em>về món này</em></h2>'+
        (duyet.length?'<p class="cn-tb"><b>'+tb.toLocaleString('vi-VN',{maximumFractionDigits:1})+'</b>'+sao(Math.round(tb))+'<span>'+duyet.length+' cảm nhận</span></p>'
          :'<p class="cn-rong">Món này chưa có cảm nhận nào. Nếu bạn đã mua, hãy là người đầu tiên chia sẻ.</p>')+
        '<button class="nut vien" type="button" id="cn-mo">Viết cảm nhận</button></div>'+
      '<div class="cn-phai">'+
        (cuaToi?'<article class="cn-the cua-toi"><div class="cn-dau">'+sao(cuaToi.sao)+'<small>Cảm nhận của bạn · đang chờ cửa hàng duyệt</small></div><p>'+e(cuaToi.chu)+'</p><b>'+e(cuaToi.ten||'Bạn')+'</b></article>':'')+
        duyet.map(function(c){return '<article class="cn-the"><div class="cn-dau">'+sao(+c.sao||5)+(c.ngay?'<small>'+e(c.ngay)+'</small>':'')+'</div><p>'+e(c.chu)+'</p><b>'+e(c.ten||'Khách hàng')+'</b></article>'}).join('')+
        '<form class="cn-form" id="cn-form" hidden novalidate>'+
          '<p class="ct2-nho-td">Bạn chấm mấy sao?</p><div class="cn-chon" role="radiogroup" aria-label="Số sao">'+[1,2,3,4,5].map(function(i){return '<button type="button" data-s="'+i+'" role="radio" aria-checked="false" aria-label="'+i+' sao">★</button>'}).join('')+'</div>'+
          '<div class="o"><label for="cn-chu">Cảm nhận của bạn</label><textarea id="cn-chu" maxlength="600" placeholder="Món nhận được có giống ảnh không, đeo lên thế nào…"></textarea></div>'+
          '<div class="o"><label for="cn-ten">Tên hiển thị</label><input id="cn-ten" maxlength="40" value="'+e(tenSan)+'"></div>'+
          '<p class="loi" id="cn-loi" hidden></p>'+
          '<div class="cn-nut"><button class="nut dac" type="submit">Gửi cảm nhận</button><button class="gio-xoa" type="button" id="cn-huy">Huỷ</button></div>'+
          '<p class="ct2-ghi">Cảm nhận được gửi cho cửa hàng qua Zalo hoặc Messenger và chỉ hiện ở đây sau khi cửa hàng duyệt.</p>'+
        '</form>'+
        '<div class="cn-xong" id="cn-xong" hidden></div>'+
      '</div></div>';
    var form=$('#cn-form'), soSao=0;
    $('#cn-mo').onclick=function(){form.hidden=false; this.hidden=true; form.scrollIntoView({block:'center',behavior:'smooth'})};
    $('#cn-huy').onclick=function(){form.hidden=true; $('#cn-mo').hidden=false};
    $$('.cn-chon button').forEach(function(b){b.onclick=function(){soSao=+b.dataset.s;
      $$('.cn-chon button').forEach(function(o){var on=+o.dataset.s<=soSao; o.classList.toggle('day',on); o.setAttribute('aria-checked',String(+o.dataset.s===soSao))})}});
    form.onsubmit=function(ev){ev.preventDefault();
      var chu=$('#cn-chu').value.trim(), ten=$('#cn-ten').value.trim(), loi=$('#cn-loi'), l='';
      if(!soSao) l='Bạn chọn số sao giúp nhé.'; else if(chu.length<10) l='Bạn viết thêm vài chữ về món này nhé.';
      if(l){loi.textContent=l; loi.hidden=false; return}
      cnMay[x.ma]={sao:soSao,chu:chu,ten:ten,luc:new Date().toISOString()};
      try{localStorage.setItem(KHOA_CN,JSON.stringify(cnMay))}catch(e3){}
      var tin='CẢM NHẬN — '+x.ten+' (mã '+x.ma+')\n'+soSao+'/5 sao\n'+chu+'\n— '+(ten||'Khách');
      veCamNhan();
      var xong=$('#cn-xong'); xong.hidden=false;
      xong.innerHTML='<b>Cảm ơn bạn.</b><p>Bấm một nút dưới đây để gửi cảm nhận cho cửa hàng.</p><div class="cn-nut">'+
        '<button class="nut dac" type="button" id="cn-zalo">Sao chép &amp; mở Zalo</button>'+
        (L.messenger?'<a class="nut vien" target="_blank" rel="noopener" href="https://m.me/'+e(L.messenger)+'?text='+encodeURIComponent(tin)+'">Gửi qua Messenger</a>':'')+'</div>';
      $('#cn-zalo').onclick=function(){var mo=function(){window.open('https://zalo.me/'+(L.zalo||L.sdt),'_blank','noopener')};
        if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(tin).then(function(){bao('Đã sao chép — dán vào Zalo để gửi'); mo()},mo); else mo()};
    };
  }
  veCamNhan();

  /* gợi ý */
  var daCo={}; daCo[x.ma]=1; var goi=[];
  function them(ds,n){ds.forEach(function(y){if(goi.length<8&&n>0&&!daCo[y.ma]&&!goi.some(function(g){return g.ten===y.ten})){daCo[y.ma]=1;goi.push(y);n--}})}
  them(coCharm.map(function(t){return t.sp}),2);
  them(DS.filter(function(y){return y.loai===x.loai}).sort(function(a,b){return Math.abs((a.gia||0)-(x.gia||0))-Math.abs((b.gia||0)-(x.gia||0))}),4-goi.length);
  if(goi.length) $('#goi-y').innerHTML='<div class="dau-khoi len"><h2>Hợp <em>đeo cùng</em></h2></div><div class="luoi">'+goi.slice(0,4).map(theSp).join('')+'</div>';
  if(window.theoDoiLen) theoDoiLen();
});
</script>
</body>
</html>
