<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tài khoản · Jadora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Be+Vietnam+Pro:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=261115154349">
<link rel="stylesheet" href="css/hieu-ung.css?v=261115154349">
<link rel="stylesheet" href="css/dau.css?v=261115154349">
</head>
<body>
<div id="dau"></div>

<main class="bb">
  <div class="trang-dau"><h1>Tài khoản</h1></div>

  <section class="dn" id="dn" aria-live="polite"><p class="tk-ghi">Đang kiểm tra đăng nhập…</p></section>

  <div class="tk">
    <section>
      <h3>Thông tin nhận hàng</h3>
      <p class="tk-ghi">Lưu trên thiết bị này để tự điền khi bạn đặt hàng.</p>
      <form class="form" id="f" novalidate>
        <div class="o"><label for="ten">Họ và tên</label><input id="ten" name="ten" autocomplete="name"></div>
        <div class="o"><label for="sdt">Số điện thoại</label><input id="sdt" name="sdt" type="tel" inputmode="numeric" autocomplete="tel"></div>
        <div class="o"><label for="diaChi">Địa chỉ nhận hàng</label><input id="diaChi" name="diaChi" autocomplete="street-address" placeholder="Số nhà, đường, phường/xã, tỉnh/thành"></div>
        <button class="nut dac" type="submit" style="justify-self:start">Lưu thông tin</button>
      </form>
      <p style="margin-top:30px"><a class="gio-xoa" href="san-pham.html?thich=1">Xem món đã lưu yêu thích →</a></p>
    </section>
    <section>
      <h3>Đơn đã đặt trên thiết bị này</h3>
      <div id="don"></div>
    </section>
  </div>
</main>

<div id="chan"></div>

<script src="js/chung.js?v=261115154349"></script>
<script src="js/hieu-ung.js?v=261115154349"></script>
<script src="js/dau.js?v=261115154349"></script>
<script src="js/khach.js?v=261115154349"></script>
<script>
var G_LOGO='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.600 1.200 9.100 3.600l6.800-6.800C35.800 2.400 30.300 0 24 0 14.600 0 6.500 5.400 2.600 13.200l7.900 6.100C12.400 13.600 17.700 9.500 24 9.500z"/><path fill="#4285F4" d="M46.500 24.500c0-1.600-.100-3.100-.400-4.500H24v9h12.700c-.600 3-2.300 5.500-4.800 7.200l7.700 6c4.500-4.200 6.900-10.300 6.900-17.700z"/><path fill="#FBBC05" d="M10.500 28.700A14.500 14.500 0 019.700 24c0-1.600.300-3.200.800-4.700l-7.900-6.100A24 24 0 000 24c0 3.900.900 7.500 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.500 0 11.900-2.100 15.900-5.800l-7.700-6c-2.100 1.400-4.900 2.300-8.200 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>';
khoiDong(function(){
  var hs={}; try{hs=JSON.parse(localStorage.getItem('jadora_ho_so'))||{}}catch(x){}
  var f=$('#f'); ['ten','sdt','diaChi'].forEach(function(k){f[k].value=hs[k]||''});
  f.onsubmit=function(ev){ev.preventDefault();
    try{localStorage.setItem('jadora_ho_so',JSON.stringify({ten:f.ten.value.trim(),sdt:f.sdt.value.trim(),diaChi:f.diaChi.value.trim()}))}catch(x){}
    bao('Đã lưu thông tin')};
  var don=[]; try{don=JSON.parse(localStorage.getItem('jadora_don'))||[]}catch(x){}
  $('#don').innerHTML=don.length? don.slice().reverse().map(function(d){
    var ng=new Date(d.luc);
    return '<div class="tk-don"><b>'+e(d.ma)+'</b><small>'+ng.toLocaleDateString('vi-VN')+'</small>'+
      '<ul>'+d.mon.map(function(m){return '<li>'+e(m.ten)+' × '+m.sl+'</li>'}).join('')+'</ul>'+
      '<div class="tong"><span>'+(d.tt==='ck'?'Chuyển khoản':'Nhận hàng trả tiền')+'</span><span>'+gia(d.tong)+'</span></div></div>'}).join('')
    : '<p class="tk-ghi">Bạn chưa đặt đơn nào trên thiết bị này.</p><a class="nut vien" href="san-pham.html">Xem sản phẩm</a>';

  /* khối đăng nhập */
  function veDn(u){
    var o=$('#dn');
    if(!KHACH.bat){o.innerHTML='<p class="tk-ghi">Web chưa bật đăng nhập.</p>'; return}
    if(u){
      o.innerHTML='<div class="dn-the">'+(u.photoURL?'<img src="'+e(u.photoURL)+'" alt="" referrerpolicy="no-referrer">':'<span class="dn-chu">'+e((u.displayName||u.email||'?').charAt(0).toUpperCase())+'</span>')+
        '<div><b>'+e(u.displayName||'Khách')+'</b><span>'+e(u.email||'')+'</span></div>'+
        '<button class="nut vien" type="button" id="dx">Đăng xuất</button></div>';
      $('#dx').onclick=function(){KHACH.dangXuat()};
      if(!f.ten.value&&u.displayName) f.ten.value=u.displayName;
    } else {
      o.innerHTML='<div class="dn-moi"><div><h3>Đăng nhập</h3><p class="tk-ghi">Đăng nhập bằng tài khoản Google để chúng tôi biết tên và email của bạn khi bạn đặt hàng.</p></div>'+
        '<button class="nut-google" type="button" id="dng">'+G_LOGO+'<span>Đăng nhập bằng Google</span></button></div>';
      $('#dng').onclick=function(){var b=this; b.disabled=true; KHACH.dangNhap().then(function(){b.disabled=false})};
    }
  }
  KHACH.nghe.push(veDn);
  KHACH.moMay().then(function(u){veDn(u)});
});
</script>
</body>
</html>
